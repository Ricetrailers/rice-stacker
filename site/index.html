<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Rice Stacker</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="tour.css">
<link rel="stylesheet" href="context-help.css">
</head>
<body>
<!-- login gate -->
<div id="authGate" class="authgate" hidden>
  <div class="authcard">
    <div class="brand" style="justify-content:center;margin-bottom:14px"><b>RICE <em>STACKER</em></b></div>
    <input id="authEmail" type="text" placeholder="Email or username" aria-label="Email or username" autocapitalize="none" autocomplete="username">
    <input id="authPass" type="password" placeholder="Password" autocomplete="current-password">
    <button class="btn primary" id="authBtn" style="width:100%;justify-content:center">Sign in</button>
    <div id="authMsg" class="authmsg"></div>
  </div>
</div>


<div class="app" id="app">
  <header class="top">
    <div class="brand" id="brandHome" title="All loads">
      <b>RICE <em>STACKER</em></b><span>load planning</span>
    </div>
    <div class="crumb" id="crumb"></div>
    <div class="spacer"></div>
    <span class="savechip" id="saveChip"></span>
    <button class="btn small ghost" id="btnYardView" hidden title="Preview exactly what yard accounts see">👁 Yard view</button>
    <button class="btn small" id="btnLibrary">Trailer library</button>
    <button class="btn small" id="btnPrint" hidden>Print sheet</button>
    <button class="btn primary small" id="btnSave" hidden>Save</button>
  </header>
  <div id="view"></div>
</div>

<input type="file" id="dxfFile" accept=".dxf,.DXF" hidden>
<input type="file" id="photoFile" accept="image/*" multiple hidden>
<div class="toasts" id="toasts"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="pdf.min.js"></script>
<script>if (window.pdfjsLib) pdfjsLib.GlobalWorkerOptions.workerSrc = "pdf.worker.min.js";</script>
<script src="config.js"></script>
<script src="dxf.js"></script>
<script src="dxf_cluster.js"></script>
<script src="storage.js"></script>
<script src="auth-ui.js"></script>
<script src="help.js"></script>
<script src="tour.js"></script>
<script src="app.js"></script>
<script src="context-help.js"></script>
</body>
</html>
